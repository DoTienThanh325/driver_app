server:
  port: 8081

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:300ms}
      lettuce:
        shutdown-timeout: 200ms
  application:
    name: userservice

  datasource:
    hikari:
      connection-timeout: ${DB_POOL_TIMEOUT_MS:500}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      data-source-properties:
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:2}
        options: "-c statement_timeout=2000 -c lock_timeout=1000"
    url: jdbc:postgresql://localhost:5432/driverapp_user_db
    username: ${DB_USERNAME:thanhtiendo}
    password: ${DB_PASSWORD:12345khongcho}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-retries: ${RABBIT_LISTENER_MAX_RETRIES:3}
          multiplier: 2.0

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

app:
  jwt:
    issuer: http://localhost:8081
    access-minutes: 15
    refresh-days: 7

  otp:
    expires-minutes: 5
    challenge-secret: ${OTP_CHALLENGE_SECRET:local-only-change-this-secret-before-deployment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

resilience:
  auth:
    enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
    expose-otp: ${AUTH_EXPOSE_OTP:true}
    policies:
      login:
        limit: ${AUTH_LOGIN_LIMIT:5}
        seconds: 60
      register:
        limit: ${AUTH_REGISTER_LIMIT:5}
        seconds: 60
      refresh:
        limit: ${AUTH_REFRESH_LIMIT:20}
        seconds: 60
      verify:
        limit: ${AUTH_VERIFY_LIMIT:5}
        seconds: 60
      otp-cooldown:
        limit: ${AUTH_OTP_COOLDOWN_LIMIT:1}
        seconds: 60
      otp-hour:
        limit: ${AUTH_OTP_HOUR_LIMIT:5}
        seconds: 3600
