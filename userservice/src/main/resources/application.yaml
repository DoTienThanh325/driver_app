server:
  port: 8081

spring:
  application:
    name: userservice

  datasource:
    url: jdbc:postgresql://localhost:5432/driverapp_user_db
    username: postgres
    password: ${DB_PASSWORD:12345khongcho}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: http://localhost:8081
    access-minutes: 15
    refresh-days: 7

  otp:
    expires-minutes: 5
    challenge-secret: ${OTP_CHALLENGE_SECRET:local-only-change-this-secret-before-deployment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}