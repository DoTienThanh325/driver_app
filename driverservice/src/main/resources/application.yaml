server:
  port: 8082

spring:
  application:
    name: driverservice

  datasource:
    url: jdbc:postgresql://localhost:5432/driverapp_driver_db
    username: thanhtiendo
    password: ${DB_PASSWORD:12345khongcho}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-attempts: 3
          multiplier: 2.0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://192.168.11.199:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:driver-documents}

services:
  user:
    base-url: ${USER_SERVICE_URL:http://userservice}