server:
  port: 8082

spring:
  application:
    name: driverservice

  datasource:
    hikari:
      connection-timeout: ${DB_POOL_TIMEOUT_MS:500}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      data-source-properties:
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:2}
        options: "-c statement_timeout=2000 -c lock_timeout=1000"
    url: jdbc:postgresql://localhost:5432/driverapp_driver_db
    username: ${DB_USERNAME:thanhtiendo}
    password: ${DB_PASSWORD:12345khongcho}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-retries: ${RABBIT_LISTENER_MAX_RETRIES:3}
          multiplier: 2.0

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:300ms}
      lettuce:
        shutdown-timeout: 200ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json
  
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:driver-documents}

services:
  user:
    base-url: ${USER_SERVICE_URL:http://userservice}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

resilience:
  http:
    enabled: ${HTTP_RESILIENCE_ENABLED:true}
    clients:
      user:
        total: ${USER_TOTAL_TIMEOUT:1500ms}
        connect: ${USER_CONNECT_TIMEOUT:300ms}
        read: ${USER_READ_TIMEOUT:1s}
        slow: ${USER_SLOW_THRESHOLD:800ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${USER_CONCURRENCY:50}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
