server:
  port: ${BOOKING_SERVICE_PORT:8083}
spring:
  application:
    name: bookingservice
  elasticsearch:
    connection-timeout: ${ES_CONNECT_TIMEOUT:500ms}
    socket-timeout: ${ES_SOCKET_TIMEOUT:1500ms}
  mongodb:
    representation:
      uuid: standard
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 2s
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-retries: ${RABBIT_LISTENER_MAX_RETRIES:3}
          multiplier: 2.0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
eureka:
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
storage:
  bucket: ${STORAGE_BUCKET:business-documents}
services:
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://notificationservice}
  driver:
    base-url: ${DRIVER_SERVICE_URL:http://driverservice}
  user:
    base-url: ${USER_SERVICE_URL:http://userservice}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://paymentservice}
  feedback:
    base-url: ${FEEDBACK_SERVICE_URL:http://feedbackservice}
matching:
  strategy: ${MATCHING_STRATEGY:AI_MODEL}
  shadow-logging: ${MATCHING_SHADOW_LOGGING:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
resilience:
  http:
    enabled: ${HTTP_RESILIENCE_ENABLED:true}
    clients:
      driver:
        total: ${DRIVER_TOTAL_TIMEOUT:1500ms}
        connect: ${DRIVER_CONNECT_TIMEOUT:300ms}
        read: ${DRIVER_READ_TIMEOUT:1s}
        slow: ${DRIVER_SLOW_THRESHOLD:800ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${DRIVER_CONCURRENCY:50}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
      user:
        total: ${USER_TOTAL_TIMEOUT:1500ms}
        connect: ${USER_CONNECT_TIMEOUT:300ms}
        read: ${USER_READ_TIMEOUT:1s}
        slow: ${USER_SLOW_THRESHOLD:800ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${USER_CONCURRENCY:50}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
      payment:
        total: ${PAYMENT_TOTAL_TIMEOUT:1500ms}
        connect: ${PAYMENT_CONNECT_TIMEOUT:300ms}
        read: ${PAYMENT_READ_TIMEOUT:1s}
        slow: ${PAYMENT_SLOW_THRESHOLD:800ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${PAYMENT_CONCURRENCY:50}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
      notification:
        total: ${NOTIFICATION_TOTAL_TIMEOUT:1500ms}
        connect: ${NOTIFICATION_CONNECT_TIMEOUT:300ms}
        read: ${NOTIFICATION_READ_TIMEOUT:1s}
        slow: ${NOTIFICATION_SLOW_THRESHOLD:800ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${NOTIFICATION_CONCURRENCY:50}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
      ai-matching:
        total: ${AI_MATCHING_TOTAL_TIMEOUT:350ms}
        connect: ${AI_MATCHING_CONNECT_TIMEOUT:100ms}
        read: ${AI_MATCHING_READ_TIMEOUT:200ms}
        slow: ${AI_MATCHING_SLOW_THRESHOLD:150ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${AI_MATCHING_CONCURRENCY:20}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
      ai-food:
        total: ${AI_FOOD_TOTAL_TIMEOUT:350ms}
        connect: ${AI_FOOD_CONNECT_TIMEOUT:100ms}
        read: ${AI_FOOD_READ_TIMEOUT:200ms}
        slow: ${AI_FOOD_SLOW_THRESHOLD:150ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${AI_FOOD_CONCURRENCY:20}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
      osrm:
        total: ${OSRM_TOTAL_TIMEOUT:1200ms}
        connect: ${OSRM_CONNECT_TIMEOUT:300ms}
        read: ${OSRM_READ_TIMEOUT:800ms}
        slow: ${OSRM_SLOW_THRESHOLD:600ms}
        pool-wait: ${HTTP_POOL_WAIT:200ms}
        concurrency: ${OSRM_CONCURRENCY:20}
        minimum-calls: ${CB_MINIMUM_CALLS:20}
        window: ${CB_WINDOW:50}
        open-wait: ${CB_OPEN_WAIT:15s}
