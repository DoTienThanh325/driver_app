server:
  port: ${BOOKING_SERVICE_PORT:8083}

spring:
  application:
    name: bookingservice

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/driverapp_booking_db}
    representation:
      uuid: standard

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:business-documents}

services:
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://notificationservice}
  driver:
    base-url: ${DRIVER_SERVICE_URL:http://driverservice}
  user:
    base-url: ${USER_SERVICE_URL:http://userservice}
  payment:
    base-url: ${PAYMENT_SERVICE_URL:http://paymentservice}