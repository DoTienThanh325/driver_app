server:
  port: ${PAYMENT_SERVICE_PORT:8084}

spring:
  application:
    name: paymentservice

  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/driverapp_payment_db}
    representation:
      uuid: standard

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000ms
          max-retries: 3
          multiplier: 2.0

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

services:
  booking:
    base-url: ${BOOKING_SERVICE_URL:http://bookingservice}

