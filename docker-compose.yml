version: '3.8'

services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API endpoint (S3)
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: driverapp-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: driverapp-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7.2-alpine
    container_name: driver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  osrm:
    image: osrm/osrm-backend:latest
    container_name: osrm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./bookingservice/osrm/data:/data
    command: osrm-routed --algorithm mld /data/hanoi.osrm

  aimatchingservice:
    build:
      context: ./aimatchingservice
      dockerfile: Dockerfile
    container_name: driverapp-aimatchingservice
    restart: unless-stopped
    ports:
      - "8087:8087"
    environment:
      - MODEL_PATH=app/models/lgbm_acceptance_model.pkl

volumes:
  minio_data:
  rabbitmq_data:
  es_data:
  redis_data: