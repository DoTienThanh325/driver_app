server:
  port: 8085

spring:
  application:
    name: feedbackservice

  datasource:
    url: jdbc:postgresql://localhost:5432/driverapp_feedback_db
    username: postgres
    password: ${DB_PASSWORD:12345khongcho}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

services:
  driver:
    base-url: ${DRIVER_SERVICE_URL:http://driverservice}
