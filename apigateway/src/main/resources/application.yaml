  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: userservice
              uri: lb://userservice
              predicates:
                - Path=/api/auth/**,/api/users/**,/.well-known/jwks.json

            - id: driverservice
              uri: lb://driverservice
              predicates:
                - Path=/api/drivers/**,/api/vehicles/**

            - id: bookingservice
              uri: lb://bookingservice
              predicates:
                - Path=/api/trips/**,/api/bookings/**

            - id: paymentservice
              uri: lb://paymentservice
              predicates:
                - Path=/api/payments/**,/api/vouchers/**

            - id: notificationservice
              uri: lb://notificationservice
              predicates:
                - Path=/api/notifications/**

            - id: feedbackservice
              uri: lb://feedbackservice
              predicates:
                - Path=/api/feedback/**,/api/feedbacks/**,/api/complaints/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}
