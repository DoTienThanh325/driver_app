eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                - ${ADMIN_FE_ORIGIN}
                - ${MOBILE_FE_ORIGIN}
